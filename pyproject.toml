[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meteora-dlmm-hedged-research"
version = "0.1.0"
description = "Independent, evidence-gated Meteora DLMM historical mechanics and market-making-surplus research"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10", "jsonschema>=4,<5"]
svm = ["solders>=0.26,<1"]
archive = ["boto3>=1.35,<2", "lz4>=4,<5", "zstandard>=0.23,<1"]

[project.scripts]
mdlmm = "mdlmm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = ["live: read-only public-network integration checks", "svm: optional local SVM checks"]
